<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f0"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Hanyu · 汉语</title><style>*{box-sizing:border-box}body{margin:0;background:#fff8f0;color:#25332f;font:16px system-ui}header,main,nav{max-width:680px;margin:auto}header{padding:calc(16px + env(safe-area-inset-top)) 18px 12px;font-size:24px;font-weight:800;color:#a83d31}main{padding:0 16px calc(90px + env(safe-area-inset-bottom))}section{background:white;border:1px solid #eaded3;border-radius:20px;padding:18px;margin:12px 0}h1,h2,p{margin:8px 0 14px}h1{font-size:25px}h2{font-size:20px}button,input,select,textarea{font:inherit;min-height:48px;border-radius:12px;padding:10px;border:1px solid #d8cfc6;margin:4px 0}button{background:#a83d31;color:white;border:0;cursor:pointer}button.alt{background:#e3efe8;color:#25332f}input,select,textarea{width:100%}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.han{font-size:54px;text-align:center;overflow-wrap:anywhere}nav{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #eaded3}nav button{flex:1;font-size:14px}canvas{width:100%;max-width:300px;aspect-ratio:1;touch-action:none;background:#fff8f0;border:1px solid #a83d31;display:block;margin:auto}small{color:#52645a}#status{min-height:24px;color:#a83d31}button:focus-visible{outline:3px solid #25332f} [hidden]{display:none!important}</style></head><body><header>Hanyu. 汉语 <small style="font-size:12px">v0.4</small></header><main><section id="home"><small>你好！</small><h1>Hôm nay học gì nào?</h1><p id="stats"></p><label for="lessons">Chọn bài học</label><select id="lessons"></select><div class="grid" id="tabs"></div><div id="activity"></div></section><section id="admin" hidden><h2>Giáo trình cá nhân</h2><p>Nội dung chỉ lưu trên thiết bị này.</p><form id="editor"><label>Tên bài<input name="title" required maxlength="100"></label><label>Chữ Hán<input name="hanzi" required maxlength="100"></label><label>Pinyin<input name="pinyin" required></label><label>Nghĩa tiếng Việt<input name="meaning" required></label><label>Đoạn đọc<textarea name="reading" required></textarea></label><button>Lưu bài học</button></form></section><section id="help" hidden><h2>Cài trên iPhone</h2><p>Mở bằng Safari → Chia sẻ → Thêm vào màn hình chính.</p><p>Học offline sau lần tải thành công. Phát âm và nhận diện giọng nói tùy thiết bị; nhận diện không phải chấm phát âm.</p><button id="backup">Xuất bản sao dữ liệu</button><label>Khôi phục bản sao<input id="restore" type="file" accept="application/json"></label></section><p id="status" role="status"></p></main><nav><button data-page="home">Học tập</button><button data-page="admin" class="alt">Giáo trình</button><button data-page="help" class="alt">Cài đặt</button></nav><script src="app.js"></script></body></html>
